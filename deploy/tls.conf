# Mounted over /etc/nginx/conf.d/default.conf on the server.
# Cloudflare (SSL mode "Full") reaches this on port 8445 through an Origin Rule.
server {
    listen 8445 ssl default_server;
    listen [::]:8445 ssl default_server;
    http2 on;
    server_name emircankaymaz.com;

    ssl_certificate     /etc/nginx/ssl/emircankaymaz.crt;
    ssl_certificate_key /etc/nginx/ssl/emircankaymaz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/site.conf;
}

server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    http2 on;
    server_name www.emircankaymaz.com;

    ssl_certificate     /etc/nginx/ssl/emircankaymaz.crt;
    ssl_certificate_key /etc/nginx/ssl/emircankaymaz.key;

    return 301 https://emircankaymaz.com$request_uri;
}
